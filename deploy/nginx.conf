# One origin for the stack: the web console, the API (two instances) and its WebSockets, and the
# basemap extract. WebSocket-only Socket.IO needs no sticky sessions: each connection lives on one
# instance, and the Redis adapter carries broadcasts between instances.
worker_processes 2;

events {
  worker_connections 8192;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/javascript mjs;
    application/octet-stream pmtiles;
  }
  sendfile on;
  server_tokens off;
  access_log off;

  # Docker's DNS, so the web container is looked up per request and nginx can start without it.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream api {
    # Shared state, so round-robin and failure marks hold across nginx worker processes.
    zone api 64k;
    server api-1:3000 max_fails=1 fail_timeout=10s;
    server api-2:3000 max_fails=1 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 80;
    client_max_body_size 26m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    # Location batches are idempotent (sequence numbers and idempotency keys), so nginx may resend
    # one to the other instance when the first fails mid-request.
    location = /v1/driver/locations {
      proxy_pass http://api;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
      proxy_next_upstream_tries 2;
    }

    location /v1/ {
      proxy_pass http://api;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }

    location /health {
      proxy_pass http://api;
      proxy_set_header Connection "";
    }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }

    # The PMTiles extract, served with range requests straight from disk.
    location /tiles/ {
      alias /srv/tiles/;
      add_header Cache-Control "public, max-age=86400";
    }

    location / {
      set $web http://web:3000;
      proxy_pass $web;
      proxy_set_header Connection "";
    }
  }
}
