version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Packages released together are updated together.
      nestjs:
        patterns: ['@nestjs/*']
      expo:
        patterns: ['expo', 'expo-*', 'react-native', 'react-native-*', '@expo/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      lint:
        patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', 'prettier']
      test:
        patterns: ['vitest', '@vitest/*', '@playwright/test', 'unplugin-swc', '@swc/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
